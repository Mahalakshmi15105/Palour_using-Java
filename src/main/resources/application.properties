# =========================================================
# Application Configuration
# =========================================================
spring.application.name=SmartGoNext Salon SaaS
server.port=8080

# =========================================================
# MySQL Database & DataSource Configuration (Master Platform)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/parlour_java_master?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tenant Database Template Settings
app.datasource.tenant.url-prefix=jdbc:mysql://localhost:3306/
app.datasource.tenant.url-suffix=?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
app.datasource.tenant.default-db=parlour_java

# =========================================================
# Spring Data JPA / Hibernate Configuration
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# Thymeleaf Configuration
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.web=INFO
logging.level.com.smartgonext=DEBUG
logging.level.org.hibernate.SQL=DEBUG
