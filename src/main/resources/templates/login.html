<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Parlour using java</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Salon SaaS Styles -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body">

    <!-- Ambient Glowing Blurs -->
    <div class="login-glow-1"></div>
    <div class="login-glow-2"></div>

    <div class="login-card" style="max-width: 460px;">
        <!-- Logo & Header -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">
                <i class="bi bi-gem"></i>
            </div>
            <h3 class="text-white fw-bold mb-1" style="letter-spacing: -0.5px;">Parlour <span style="font-size: 0.9rem; font-weight: 400; opacity: 0.85;">using java</span></h3>
            <p class="text-secondary small text-uppercase mb-0" style="letter-spacing: 1px; color: #d4a373 !important;">Beauty Parlour & Salon Management</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-octagon-fill"></i>
            <span th:text="${errorMessage}">Error</span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-success py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${logoutMessage}">Logged out</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label text-light small fw-semibold">Work Email / Salon ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-color: rgba(255,255,255,0.15) !important;">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" class="form-control login-input" placeholder="admin@123.com" value="admin@123.com" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label text-light small fw-semibold mb-1">Password</label>
                    <a href="javascript:void(0)" class="small text-decoration-none" style="color: #d4a373; font-size: 0.78rem;">Forgot?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-color: rgba(255,255,255,0.15) !important;">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control login-input" placeholder="••••••••" value="admin123" required autocomplete="current-password">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label text-secondary small" for="rememberMe">Remember terminal</label>
                </div>
                <span class="badge bg-dark border border-secondary text-light small py-1 px-2" style="font-size: 0.7rem;">
                    <i class="bi bi-shield-lock-fill text-warning me-1"></i> BCrypt Secured
                </span>
            </div>

            <button type="submit" class="btn btn-salon-primary w-100 py-2 fs-6 justify-content-center mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Dashboard
            </button>
        </form>

        <!-- Role Presets Box for Testing -->
        <div class="p-3 rounded-3" style="background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15);">
            <div class="small text-light mb-2 fw-semibold d-flex align-items-center justify-content-between">
                <span><i class="bi bi-people-fill text-warning me-1"></i> Test Role Credentials:</span>
                <span class="badge bg-secondary" style="font-size: 0.65rem;">Click to Fill</span>
            </div>
            <div class="d-grid gap-1" style="font-size: 0.75rem;">
                <button type="button" class="btn btn-sm btn-outline-light text-start py-1 px-2 d-flex justify-content-between align-items-center"
                        onclick="setCreds('superadmin@123.com', 'admin123')">
                    <span><strong class="text-warning">SUPER_ADMIN</strong>: superadmin@123.com</span>
                    <span class="badge bg-dark border border-secondary">admin123</span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-light text-start py-1 px-2 d-flex justify-content-between align-items-center"
                        onclick="setCreds('admin@123.com', 'admin123')">
                    <span><strong class="text-info">PARLOUR_ADMIN</strong>: admin@123.com</span>
                    <span class="badge bg-dark border border-secondary">admin123</span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-light text-start py-1 px-2 d-flex justify-content-between align-items-center"
                        onclick="setCreds('branchadmin@123.com', 'staff123')">
                    <span><strong class="text-primary">BRANCH_ADMIN</strong>: branchadmin@123.com</span>
                    <span class="badge bg-dark border border-secondary">staff123</span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-light text-start py-1 px-2 d-flex justify-content-between align-items-center"
                        onclick="setCreds('employee@123.com', 'staff123')">
                    <span><strong class="text-success">EMPLOYEE</strong>: employee@123.com</span>
                    <span class="badge bg-dark border border-secondary">staff123</span>
                </button>
            </div>
        </div>

        <div class="text-center mt-3">
            <span class="text-secondary small" style="font-size: 0.72rem;">&copy; 2026 Parlour using java &bull; Multi-Tenant Salon ERP</span>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function setCreds(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }
    </script>
</body>
</html>
