<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SmartGoNext Salon SaaS</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Salon SaaS Styles -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body">

    <!-- Ambient Glowing Blurs -->
    <div class="login-glow-1"></div>
    <div class="login-glow-2"></div>

    <div class="login-card">
        <!-- Logo & Header -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">
                <i class="bi bi-gem"></i>
            </div>
            <h3 class="text-white fw-bold mb-1" style="letter-spacing: -0.5px;">SmartGoNext</h3>
            <p class="text-secondary small text-uppercase mb-0" style="letter-spacing: 1px; color: #d4a373 !important;">Beauty Parlour & Salon SaaS</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-octagon-fill"></i>
            <span th:text="${errorMessage}">Error</span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-success py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${logoutMessage}">Logged out</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label text-light small fw-semibold">Work Email / Salon ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-color: rgba(255,255,255,0.15) !important;">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" class="form-control login-input" placeholder="admin@smartgonext.com" value="admin@smartgonext.com" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label text-light small fw-semibold mb-1">Password</label>
                    <a href="javascript:void(0)" class="small text-decoration-none" style="color: #d4a373; font-size: 0.78rem;">Forgot?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-color: rgba(255,255,255,0.15) !important;">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control login-input" placeholder="••••••••" value="admin123" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label text-secondary small" for="rememberMe">Remember this terminal</label>
                </div>
                <span class="badge bg-dark border border-secondary text-light small py-1 px-2" style="font-size: 0.7rem;">
                    <i class="bi bi-geo-alt-fill text-warning me-1"></i> Downtown Flagship
                </span>
            </div>

            <button type="submit" class="btn btn-salon-primary w-100 py-2 fs-6 justify-content-center mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Access Salon Dashboard
            </button>
        </form>

        <!-- Demo Quick Access Hint Box -->
        <div class="p-3 rounded-3" style="background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15);">
            <div class="d-flex align-items-center justify-content-between">
                <div class="small text-light">
                    <i class="bi bi-key-fill text-warning me-1"></i> <strong>Demo Credentials</strong>:
                    <div class="text-secondary" style="font-size: 0.75rem;">admin@smartgonext.com / admin123</div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-light border-secondary" style="font-size: 0.75rem;" onclick="document.forms[0].submit();">
                    Auto-Login
                </button>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="text-center mt-4">
            <span class="text-secondary small" style="font-size: 0.75rem;">
                Protected by SmartGoNext Cloud Security &bull; Phase 1 Prototype
            </span>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
