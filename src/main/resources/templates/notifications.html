<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Notifications & Alerts')}"></head>
<body>

<div th:replace="~{fragments/layout :: app_shell(~{::#notificationsContent})}">
    <div id="notificationsContent">
        
        <!-- Header -->
        <div class="page-header">
            <div class="page-title-wrap">
                <h2>Salon Notifications & Operational Alerts</h2>
                <p>Stay informed about inventory low-stock warnings, VIP client check-ins, duty shifts, and revenue milestones.</p>
            </div>
            <div class="page-actions">
                <button type="button" class="btn btn-salon-outline" onclick="showToast('All notifications marked as read', 'info')">
                    <i class="bi bi-check2-all me-1"></i> Mark All as Read
                </button>
                <button type="button" class="btn btn-salon-primary" onclick="showToast('Opened broadcast alert dialog', 'info')">
                    <i class="bi bi-megaphone-fill me-1"></i> Send Staff Alert
                </button>
            </div>
        </div>

        <!-- Notifications Card List -->
        <div class="salon-card">
            <div class="salon-card-header">
                <h5 class="salon-card-title"><i class="bi bi-bell-fill text-danger"></i> Recent System Feed</h5>
                <span class="badge bg-danger-subtle text-danger border border-danger-subtle">4 Unread Alerts</span>
            </div>
            <div class="salon-card-body p-0">
                <div class="list-group list-group-flush">
                    <div class="list-group-item p-3 d-flex align-items-center justify-content-between" th:each="n : ${notifications}">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle d-flex align-items-center justify-content-center"
                                 style="width: 44px; height: 44px;"
                                 th:classappend="${n.category == 'Inventory' ? 'bg-warning-subtle text-warning' : 
                                                  (n.category == 'Appointment' ? 'bg-primary-subtle text-primary' : 
                                                  (n.category == 'Billing' ? 'bg-success-subtle text-success' : 'bg-info-subtle text-info'))}">
                                <i class="bi bi-box-seam fs-5" th:if="${n.category == 'Inventory'}"></i>
                                <i class="bi bi-person-check fs-5" th:if="${n.category == 'Appointment'}"></i>
                                <i class="bi bi-cash-stack fs-5" th:if="${n.category == 'Billing'}"></i>
                                <i class="bi bi-info-circle fs-5" th:if="${n.category == 'System'}"></i>
                            </div>
                            <div>
                                <div class="d-flex align-items-center gap-2">
                                    <h6 class="mb-0 fw-bold text-dark" th:text="${n.title}">Low Inventory Alert</h6>
                                    <span class="badge" 
                                          th:classappend="${n.priority == 'High' ? 'bg-danger text-white' : 
                                                           (n.priority == 'Normal' ? 'bg-primary text-white' : 'bg-secondary text-white')}"
                                          th:text="${n.priority}">High</span>
                                </div>
                                <p class="text-muted small mb-0 mt-1" th:text="${n.message}">Only 3 bottles remaining in Downtown branch backbar.</p>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="small text-muted mb-2" th:text="${n.timeAgo}">12 min ago</div>
                            <button class="btn btn-sm btn-outline-secondary py-1 px-2" onclick="showToast('Alert acknowledged', 'success')">
                                Dismiss
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
